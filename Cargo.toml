[package]
name = "p2p_chess"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
iced = { version = "0.14.0", features = ["canvas", "svg", "advanced", "tokio"] }
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shakmaty = "0.30.2"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.21.1"
